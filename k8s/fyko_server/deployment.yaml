apiVersion: apps/v1
kind: Deployment
metadata:
  name: fyko-server
  namespace: fyko
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fyko-server
  template:
    metadata:
      labels:
        app: fyko-server
    spec:
      containers:
        - name: fyko-server
          image: fyko_server:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: fyko-config
            - secretRef:
                name: fyko-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
