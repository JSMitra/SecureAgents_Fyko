apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ann-generator
  namespace: fyko-cluster
spec:
  serviceName: ann-generator
  replicas: 2
  selector:
    matchLabels:
      app: ann-generator
  template:
    metadata:
      labels:
        app: ann-generator
    spec:
      containers:
        - name: ann-generator
          image: ann_generator:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: fyko-config
            - secretRef:
                name: fyko-secrets
          env:
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name

