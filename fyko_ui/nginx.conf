server {
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy to Secret Plan Creator
    location /api/creator/ {
        proxy_pass http://secret-plan-creator:9001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
    }

    # Proxy to Secret Plan Reviewer
    location /api/reviewer/ {
        proxy_pass http://secret-plan-reviewer:9002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Proxy to Fyko Server
    location /api/server/ {
        proxy_pass http://fyko-server:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

